[package]
name = "disk-janitor"
version = "0.5.0"
edition = "2021"
description = "轻量高速磁盘分析与清理"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rayon = "1.10"
trash = "5"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
winreg = "0.55"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
