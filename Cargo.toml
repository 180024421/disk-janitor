[package]
name = "disk-janitor"
version = "0.9.0"
edition = "2021"
description = "大帅清理器 — 轻量高速磁盘分析与清理"
license = "MIT"
publish = false

[[bin]]
name = "disk-janitor"
path = "src/main.rs"

[[bin]]
name = "dashuai-cleaner-setup"
path = "installer/setup_main.rs"
required-features = ["setup"]

[features]
default = []
setup = ["dep:zip"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rayon = "1.10"
trash = "5"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
winreg = "0.55"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
ntfs-reader = "0.4.5"
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
